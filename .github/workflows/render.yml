name: Render Portfolio Reel

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Render quality"
        required: false
        default: "standard"
        type: choice
        options: [draft, standard, high]
      format:
        description: "Output format"
        required: false
        default: "mp4"
        type: choice
        options: [mp4, webm]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 xvfb

      - name: Render video
        run: |
          mkdir -p renders
          xvfb-run --auto-servernum npx --yes hyperframes render \
            --quality ${{ inputs.quality }} \
            --format ${{ inputs.format }} \
            --output renders/portfolio-reel.${{ inputs.format }} \
            --workers 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-reel-${{ inputs.quality }}
          path: renders/
          retention-days: 7
