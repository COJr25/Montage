<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bento Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@200;300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>* { margin: 0; padding: 0; box-sizing: border-box; } body { background: #000; }</style>
</head>
<body>
<div
  data-composition-id="bento-grid"
  data-start="0"
  data-duration="18"
  data-width="1080"
  data-height="1920"
  style="position:relative;width:1080px;height:1920px;overflow:hidden;background:#060810;"
>

<!-- STYLES -->
<style id="comp-styles">
[data-composition-id="bento-grid"] { font-family: 'Inter', sans-serif; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.blob { position: absolute; border-radius: 50%; pointer-events: none; }
.blob-1 { width:700px; height:700px; top:-100px; left:-150px; background:radial-gradient(ellipse, rgba(0,80,200,0.10) 0%, transparent 70%); }
.blob-2 { width:500px; height:500px; top:600px; right:-100px; background:radial-gradient(ellipse, rgba(80,0,180,0.08) 0%, transparent 70%); }
.blob-3 { width:400px; height:400px; bottom:300px; left:100px; background:radial-gradient(ellipse, rgba(0,150,100,0.06) 0%, transparent 70%); }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1.2fr 1fr 0.7fr;
  gap: 20px; padding: 80px 48px;
  height: 100%; box-sizing: border-box;
}
.widget {
  background: linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(255,255,255,0.11);
  border-radius: 36px; padding: 32px;
  color: #f5f5f7; position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.3);
}
.widget::before {
  content: ''; position: absolute;
  top: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
}
/* CALENDAR */
.widget-calendar { grid-column: 1; grid-row: 1; }
.cal-month { font-size:20px; font-weight:500; color:rgba(255,255,255,0.45); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
.cal-day { font-size:96px; font-weight:700; line-height:1; letter-spacing:-4px; color:#fff; }
.cal-weekday { position:absolute; bottom:28px; left:32px; font-size:22px; font-weight:300; color:rgba(255,255,255,0.4); }
.cal-ring-wrap { position:absolute; top:24px; right:24px; }
/* BATTERY */
.widget-battery { grid-column: 2; grid-row: 1; }
.bat-number { font-size:68px; font-weight:700; letter-spacing:-3px; line-height:1; color:#4ade80; margin-top:14px; }
.bat-number .unit { font-size:28px; font-weight:300; color:rgba(255,255,255,0.4); }
.bat-label { font-size:20px; color:rgba(255,255,255,0.4); margin-top:6px; }
.bat-bar-wrap { position:absolute; bottom:28px; left:32px; right:32px; height:8px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
.bat-bar { height:100%; width:21%; background:#f97316; border-radius:4px; }
/* CAR */
.widget-car { grid-column:1/3; grid-row:2; padding:0; overflow:hidden; background:linear-gradient(135deg, rgba(10,18,32,0.98) 0%, rgba(6,8,16,0.98) 100%); }
.car-info { position:absolute; top:28px; left:36px; }
.car-label { font-size:18px; font-weight:500; color:rgba(255,255,255,0.35); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px; }
.car-model { font-size:40px; font-weight:700; color:#fff; letter-spacing:-1px; }
.car-body-wrap { position:absolute; bottom:52px; left:50%; transform:translateX(-50%); width:820px; }
.car-glow { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); width:600px; height:60px; background:radial-gradient(ellipse, rgba(0,130,255,0.22) 0%, transparent 70%); pointer-events:none; }
.car-hl-glow { position:absolute; right:72px; bottom:85px; width:70px; height:35px; background:radial-gradient(ellipse, rgba(220,240,255,0.6) 0%, transparent 80%); pointer-events:none; opacity:0.3; }
.car-footer { position:absolute; bottom:22px; left:36px; right:36px; display:flex; align-items:center; justify-content:space-between; }
.car-status { display:flex; align-items:center; gap:10px; font-size:20px; color:rgba(255,255,255,0.5); }
.car-dot { width:10px; height:10px; background:#4ade80; border-radius:50%; box-shadow:0 0 8px #4ade80; }
.car-range { font-size:36px; font-weight:700; color:#fff; }
.car-range .unit { font-size:18px; font-weight:300; color:rgba(255,255,255,0.4); }
/* CLOCK */
.widget-clock { grid-column:1; grid-row:3; }
.clock-city { font-size:18px; font-weight:500; color:rgba(255,255,255,0.4); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:6px; }
.clock-time { font-size:58px; font-weight:700; letter-spacing:-2px; line-height:1; }
.clock-ampm { font-size:26px; font-weight:300; color:rgba(255,255,255,0.4); }
.clock-face-wrap { position:absolute; bottom:18px; right:18px; width:130px; height:130px; }
/* NAV */
.widget-nav { grid-column:2; grid-row:3; }
.nav-eta-label { font-size:18px; font-weight:500; color:rgba(255,255,255,0.4); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:4px; }
.nav-time { font-size:62px; font-weight:700; letter-spacing:-3px; line-height:1; }
.nav-unit { font-size:24px; font-weight:300; color:rgba(255,255,255,0.4); }
.nav-dest { font-size:18px; color:rgba(255,255,255,0.4); margin-top:6px; }
.nav-map-wrap { position:absolute; bottom:0; left:0; right:0; height:155px; overflow:hidden; border-radius:0 0 35px 35px; }
/* CALL */
.widget-call { grid-column:1; grid-row:4; padding:24px 28px; display:flex; align-items:center; }
.call-inner { display:flex; align-items:center; gap:16px; width:100%; }
.call-avatar { width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; color:#fff; flex-shrink:0; }
.call-info { flex:1; }
.call-name { font-size:24px; font-weight:600; color:#fff; }
.call-sub { font-size:16px; color:rgba(255,255,255,0.38); margin-top:2px; }
.call-btns { display:flex; gap:12px; }
.call-btn { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.call-accept { background:#34c759; box-shadow:0 0 16px rgba(52,199,89,0.4); }
.call-decline { background:#ff3b30; box-shadow:0 0 16px rgba(255,59,48,0.35); }
/* FLIGHT */
.widget-flight { grid-column:2; grid-row:4; padding:24px 28px; display:flex; flex-direction:column; justify-content:space-between; }
.flight-route { display:flex; align-items:center; gap:8px; }
.flight-city-code { font-size:38px; font-weight:700; letter-spacing:-1px; line-height:1; }
.flight-city-name { font-size:14px; color:rgba(255,255,255,0.38); margin-top:2px; }
.flight-mid { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 8px; }
.flight-plane { font-size:22px; display:inline-block; }
.flight-dur { font-size:14px; color:rgba(255,255,255,0.3); white-space:nowrap; }
.flight-status { font-size:16px; color:rgba(255,255,255,0.38); }
.flight-status .on { color:#ffd60a; }
/* SIGNATURE */
#scene-sig { background:#060810; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.sig-tagline { font-size:24px; font-weight:300; letter-spacing:0.22em; text-transform:uppercase; color:rgba(240,236,230,0.4); margin-top:40px; }
</style>

<!-- SCRIPT -->
<script id="comp-script">
window.__timelines = window.__timelines || {};

// Build clock markers synchronously
(function() {
  var g = document.getElementById('clock-markers');
  var cx = 65, cy = 65;
  for (var i = 0; i < 12; i++) {
    var angle = (i * 30 - 90) * Math.PI / 180;
    var isMajor = i % 3 === 0;
    var r1 = isMajor ? 48 : 50;
    var r2 = isMajor ? 56 : 54;
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', (cx + r1 * Math.cos(angle)).toFixed(2));
    line.setAttribute('y1', (cy + r1 * Math.sin(angle)).toFixed(2));
    line.setAttribute('x2', (cx + r2 * Math.cos(angle)).toFixed(2));
    line.setAttribute('y2', (cy + r2 * Math.sin(angle)).toFixed(2));
    line.setAttribute('stroke', 'rgba(255,255,255,0.4)');
    line.setAttribute('stroke-width', isMajor ? '2.5' : '1.5');
    line.setAttribute('opacity', '0');
    line.classList.add('clock-marker');
    g.appendChild(line);
  }
})();

var batData = { val: 21 };
var tl = gsap.timeline({ paused: true });

// GRID SPRING-IN (stagger from center outward)
tl.from('#w-car',      { scale:0.72, opacity:0, duration:0.70, ease:'back.out(2.2)' }, 0.15);
tl.from('#w-calendar', { scale:0.72, opacity:0, duration:0.65, ease:'back.out(1.9)' }, 0.25);
tl.from('#w-battery',  { scale:0.72, opacity:0, duration:0.65, ease:'back.out(1.9)' }, 0.25);
tl.from('#w-clock',    { scale:0.72, opacity:0, duration:0.60, ease:'back.out(1.7)' }, 0.35);
tl.from('#w-nav',      { scale:0.72, opacity:0, duration:0.60, ease:'back.out(1.7)' }, 0.35);
tl.from('#w-call',     { scale:0.72, opacity:0, duration:0.55, ease:'back.out(1.5)' }, 0.45);
tl.from('#w-flight',   { scale:0.72, opacity:0, duration:0.55, ease:'back.out(1.5)' }, 0.45);

// CALENDAR
tl.to('#cal-ring', { strokeDashoffset:50, duration:1.3, ease:'power3.out' }, 1.3);
tl.from('#cal-day', { scale:0.3, opacity:0, duration:0.5, ease:'back.out(3.5)' }, 1.5);

// BATTERY counter + bar
tl.to(batData, { val:57, duration:1.5, ease:'power2.inOut',
  onUpdate: function() {
    var el = document.getElementById('bat-number');
    if (el) el.innerHTML = Math.round(batData.val) + '<span class="unit">%</span>';
  }
}, 1.5);
tl.fromTo('#bat-bar',
  { width:'21%', backgroundColor:'#f97316' },
  { width:'57%', backgroundColor:'#4ade80', duration:1.5, ease:'power2.inOut' }, 1.5);
tl.fromTo('#bat-inner', { attr:{width:10} }, { attr:{width:25}, duration:1.5, ease:'power2.inOut' }, 1.5);

// CLOCK markers radial reveal + hands bounce
var markers = document.querySelectorAll('.clock-marker');
for (var i = 0; i < markers.length; i++) {
  tl.to(markers[i], { opacity:1, duration:0.1, ease:'power2.out' }, 3.0 + i * 0.08);
}
tl.fromTo('#clock-hr',
  { rotation:0, transformOrigin:'65px 65px' },
  { rotation:290.5, duration:0.9, ease:'back.out(1.8)' }, 3.5);
tl.fromTo('#clock-min',
  { rotation:0, transformOrigin:'65px 65px' },
  { rotation:246, duration:0.75, ease:'back.out(2.2)' }, 3.7);

// CAR drift + glow
tl.to('#car-body-wrap', { x:18, duration:2.5, ease:'sine.inOut', yoyo:true, repeat:1 }, 5.0);
tl.to('#car-hl-glow',   { opacity:1, scale:1.5, duration:0.9, ease:'sine.inOut', yoyo:true, repeat:3 }, 5.0);
tl.to('#car-dot',       { scale:1.4, duration:0.6, ease:'sine.inOut', yoyo:true, repeat:5 }, 5.2);

// NAVIGATION route draw
tl.to('#nav-route',      { strokeDashoffset:0, duration:2.2, ease:'power2.inOut' }, 9.0);
tl.to('#nav-route-glow', { strokeDashoffset:0, duration:2.2, ease:'power2.inOut' }, 9.0);
tl.to('#nav-dest-dot',   { attr:{r:7}, duration:0.35, ease:'back.out(3)' }, 11.1);
tl.fromTo('#nav-dest-ring',
  { attr:{r:0}, opacity:1 },
  { attr:{r:18}, opacity:0, duration:0.9, ease:'power2.out' }, 11.2);

// CALL pulse
tl.to('#call-avatar', {
  boxShadow:'0 0 0 6px rgba(52,199,89,0.45), 0 0 0 12px rgba(52,199,89,0.18)',
  duration:0.6, ease:'power2.out', yoyo:true, repeat:3
}, 11.5);

// FLIGHT plane travel
tl.to('#flight-plane', { x:72, duration:1.5, ease:'power2.inOut' }, 12.0);

// FLASH TRANSITION
tl.to('#flash-overlay', { opacity:1, duration:0.5, ease:'power2.in' }, 14.6);
tl.to('#flash-overlay', { opacity:0, duration:0.4, ease:'power2.out' }, 15.5);

// SIGNATURE OUTRO
tl.to('#sig-s',         { strokeDashoffset:0, duration:1.4, ease:'power2.inOut' }, 15.6);
tl.to('#sig-divider',   { strokeDashoffset:0, duration:0.5, ease:'power2.out' }, 15.85);
tl.to('#ignature-rect', { attr:{width:490}, duration:1.0, ease:'power3.out' }, 16.4);
tl.to('#sig-tagline',   { opacity:0.75, duration:0.6, ease:'power2.out' }, 17.2);

window.__timelines['bento-grid'] = tl;
</script>

</div>
</body>
</html>
